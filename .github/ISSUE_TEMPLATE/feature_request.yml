name: Feature request
description: Suggest a new endpoint, helper or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please discuss new features here before opening a pull request — it
        saves work on both sides.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe what you are trying to do with the Stedi APIs from your Laravel app.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the package behave? Include config or API ideas if you have them.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself.
